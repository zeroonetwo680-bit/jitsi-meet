# Coolify: New Resource -> Docker Compose (from Git repo) -> point to this file.
# Set the domain on the "web" service (port 80) and fill the env vars in .env.example.
# Open UDP 10000 on the VPS firewall (ufw allow 10000/udp).

x-common-env: &common-env
  TZ: ${TZ:-UTC}
  XMPP_DOMAIN: meet.jitsi
  XMPP_AUTH_DOMAIN: auth.meet.jitsi
  XMPP_MUC_DOMAIN: muc.meet.jitsi
  XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
  XMPP_SERVER: prosody
  JICOFO_AUTH_USER: focus
  JVB_AUTH_USER: jvb
  # Trainer signs in with a JWT issued by the Abaqera API (moderator); students join as guests
  ENABLE_AUTH: ${ENABLE_AUTH:-1}
  ENABLE_GUESTS: ${ENABLE_GUESTS:-1}
  AUTH_TYPE: ${AUTH_TYPE:-jwt}
  XMPP_GUEST_DOMAIN: ${XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
  JWT_APP_ID: ${JWT_APP_ID:-abaqera}
  JWT_APP_SECRET: ${JWT_APP_SECRET:?set JWT_APP_SECRET, a long random string shared with the Abaqera API}
  JWT_ACCEPTED_ISSUERS: ${JWT_ACCEPTED_ISSUERS:-abaqera}
  JWT_ACCEPTED_AUDIENCES: ${JWT_ACCEPTED_AUDIENCES:-abaqera}
  # Server-side lecture recording (Jibri). Needs the snd-aloop kernel module on the VPS, see docs/jitsi-recording.md
  ENABLE_RECORDING: ${ENABLE_RECORDING:-1}
  XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
  JIBRI_BREWERY_MUC: jibribrewery
  JIBRI_XMPP_USER: jibri
  JIBRI_RECORDER_USER: recorder
  ENABLE_AV_MODERATION: ${ENABLE_AV_MODERATION:-1}

services:
  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_FQDN_WEB_80: ""
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://meet.example.com}
      DISABLE_HTTPS: 1
      ENABLE_HTTP_REDIRECT: 0
      XMPP_BOSH_URL_BASE: http://prosody:5280
      # Abaqera lecture login page, see docs/abaqera-lecture-login-page.md (empty = off)
      TOKEN_AUTH_URL: ${TOKEN_AUTH_URL:-}
      START_WITH_AUDIO_MUTED: ${START_WITH_AUDIO_MUTED:-true}
      START_WITH_VIDEO_MUTED: ${START_WITH_VIDEO_MUTED:-true}
    depends_on: [prosody]

  prosody:
    image: jitsi/prosody:${JITSI_TAG:-stable}
    restart: unless-stopped
    expose: ["5222", "5347", "5280"]
    volumes:
      - prosody-config:/config
      - prosody-plugins:/prosody-plugins-custom
    environment:
      <<: *common-env
      PUBLIC_URL: ${PUBLIC_URL}
      JICOFO_AUTH_PASSWORD: ${SERVICE_PASSWORD_JICOFO}
      JVB_AUTH_PASSWORD: ${SERVICE_PASSWORD_JVB}
      JIBRI_XMPP_PASSWORD: ${SERVICE_PASSWORD_JIBRI}
      JIBRI_RECORDER_PASSWORD: ${SERVICE_PASSWORD_RECORDER}
      # Moderator only from the token: context.user.moderator=true or affiliation owner/moderator -> moderator,
      # any other token holder (students) -> plain member. See resources/prosody-plugins/mod_token_affiliation.lua
      XMPP_MUC_MODULES: ${XMPP_MUC_MODULES:-token_affiliation}

  jicofo:
    image: jitsi/jicofo:${JITSI_TAG:-stable}
    restart: unless-stopped
    environment:
      <<: *common-env
      JICOFO_AUTH_PASSWORD: ${SERVICE_PASSWORD_JICOFO}
      # Jicofo must not hand moderator to the first person in the room or to whoever is left:
      # the token (via token_affiliation) is the only source of moderator rights.
      ENABLE_AUTO_OWNER: ${ENABLE_AUTO_OWNER:-false}
    depends_on: [prosody]

  jvb:
    image: jitsi/jvb:${JITSI_TAG:-stable}
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    environment:
      <<: *common-env
      JVB_AUTH_PASSWORD: ${SERVICE_PASSWORD_JVB}
      JVB_PORT: 10000
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS:?set to the VPS public IP}
    depends_on: [prosody]

  jibri:
    # Jitsi's Jibri plus the academy's finalize script (docker/jibri): it moves each finished recording into the
    # organised recordings volume and registers it with the Abaqera API.
    build:
      context: docker/jibri
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/snd:/dev/snd
    shm_size: 2gb
    volumes:
      - jibri-recordings:/config/recordings
      - lecture-recordings:/recordings
    environment:
      <<: *common-env
      # Jibri's Chrome opens <PUBLIC_URL>/<room>. Without it Jibri uses https://<XMPP_DOMAIN> (meet.jitsi), which does
      # not resolve, and every recording fails to start.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://meet.example.com}
      JIBRI_XMPP_PASSWORD: ${SERVICE_PASSWORD_JIBRI}
      JIBRI_RECORDER_PASSWORD: ${SERVICE_PASSWORD_RECORDER}
      JIBRI_RECORDING_DIR: /config/recordings
      JIBRI_FINALIZE_RECORDING_SCRIPT_PATH: /opt/abaqera/finalize.sh
      RECORDER_API_URL: ${RECORDER_API_URL:-}
      RECORDER_SECRET: ${RECORDER_SECRET:-}
      RECORDINGS_ROOT: /recordings
      JIBRI_STRIP_DOMAIN_JID: muc
      DISPLAY: ":0"
      DISPLAY_NAME: Recorder
    depends_on: [prosody]

  # Plays recorded lectures to the dashboard: expiring signed links only. Give it its own domain in Coolify
  # (e.g. recordings.geniusesksa.com) and put that address in the API as Jitsi__RecordingsUrl.
  recordings:
    build:
      context: docker/recordings
    restart: unless-stopped
    environment:
      SERVICE_FQDN_RECORDINGS_80: ""
      RECORDER_SECRET: ${RECORDER_SECRET:-}
    volumes:
      - lecture-recordings:/recordings:ro

  # Removes the files of recordings deleted in the dashboard, and makes the volume writable for Jibri.
  recordings-cleaner:
    build:
      context: docker/recordings-cleaner
    restart: unless-stopped
    environment:
      RECORDER_API_URL: ${RECORDER_API_URL:-}
      RECORDER_SECRET: ${RECORDER_SECRET:-}
      RECORDINGS_ROOT: /recordings
    volumes:
      - lecture-recordings:/recordings

volumes:
  prosody-config:
  prosody-plugins:
  jibri-recordings:
  # The organised library: courses/<course>/<cohort>/<date>_session-NN_<time>_<room>/ (see docs/lecture-recordings.md)
  lecture-recordings:
